name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./... -v

  build-and-release:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: bitbucket-mcp-linux-amd64
          - os: linux
            arch: arm64
            name: bitbucket-mcp-linux-arm64
          - os: darwin
            arch: amd64
            name: bitbucket-mcp-darwin-amd64
          - os: darwin
            arch: arm64
            name: bitbucket-mcp-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o ${{ matrix.name }} ./cmd/bitbucket-mcp/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: matrix.arch == 'amd64' && matrix.os == 'linux'
        with:
          files: |
            bitbucket-mcp-linux-amd64
            bitbucket-mcp-linux-arm64
            bitbucket-mcp-darwin-amd64
            bitbucket-mcp-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
