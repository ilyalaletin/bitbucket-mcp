name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./... -v

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/bitbucket-mcp/

  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test

    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build ${{ matrix.os }}-${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -o bitbucket-mcp-${{ matrix.os }}-${{ matrix.arch }} ./cmd/bitbucket-mcp/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitbucket-mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: bitbucket-mcp-${{ matrix.os }}-${{ matrix.arch }}
